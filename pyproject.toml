[project]
name = "blogagenticapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagenticapp = "blogagenticapp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
